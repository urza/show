name: Build and publish container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # The AMD64 image must pass server/test.sh before anything is published.
      - name: Build AMD64 image for the test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: server
          pull: true
          platforms: linux/amd64
          load: true
          tags: show:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test
        run: |
          # A token for this run only. The server refuses a token of fewer than 24 characters.
          token=$(openssl rand -hex 24)
          docker run -d --name show -p 7469:7469 -e SHOW_TOKEN="$token" show:test
          for i in $(seq 1 20); do curl -fsS http://localhost:7469/healthz >/dev/null && break; sleep 0.5; done
          SHOW_URL=http://localhost:7469 SHOW_TOKEN="$token" bash server/test.sh
          docker logs show

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/show
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
      # A pull request builds both images too, and does not publish them. The ARM64 image is a
      # cross build with its own toolchain, so it can fail when the AMD64 image builds.
      - name: Build AMD64 and ARM64 images, and publish them outside a pull request
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: server
          pull: true
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
